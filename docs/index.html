    oninput="applyFilters()">

    <option value="65">65 — Hautes-Pyrénées</option>

    <option value="">Tous métiers</option>
  </select>

  <select id="f-statut" class="border rounded-md px-3 py-1.5 text-sm bg-white focus:outline-none" onchange="applyFilters()">

    <option value="nouveau">Nouveau</option>
    <option value="a_contacter">À contacter</option>
    <option value="contacte">Contacté</option>
    <option value="rdv">RDV</option>
    <option value="adherent">Adhérent</option>
  </select>

    <option value="">RGE : tous</option>
    <option value="oui">RGE uniquement</option>
    <option value="non">Non RGE</option>
  </select>

  <div class="ml-auto flex gap-2">
    <button onclick="resetFilters()" class="border rounded-md px-3 py-1.5 text-xs text-gray-500 hover:bg-gray-50">
      Réinitialiser
    </button>
    <button onclick="exportCsv()" class="border rounded-md px-3 py-1.5 text-sm hover:bg-gray-50 transition font-medium">
      ⬇ Exporter CSV
    </button>
  </div>
</div>

<!-- COMPTEUR -->
<div class="px-4 py-1.5 text-xs text-gray-500 bg-gray-50 border-b shrink-0" id="counter"></div>

<!-- TABLE -->
<div class="flex-1 overflow-auto">
<table class="w-full text-sm border-collapse">
  <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm">
    <tr>
      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide border-b cursor-pointer" onclick="sortBy('nom_entreprise')">Entreprise <span id="s-nom_entreprise" class="text-gray-400"></span></th>

      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide border-b cursor-pointer" onclick="sortBy('ville')">Ville <span id="s-ville" class="text-gray-400"></span></th>

      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide border-b">Statut</th>
      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide border-b" style="width:55px">RGE</th>
      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide border-b" style="width:80px">Adhérent</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<!-- PAGINATION -->
<div class="flex items-center justify-between px-4 py-2 border-t bg-white text-sm shrink-0">

  <div class="flex gap-1">

  {id:44,nom:'CHARPENTE OSSATURE BOIS MARTIN',siret:'60012345678901',siren:'600123456',naf:'43.91B',activite:'Charpente et ossature bois — construction bois',metier:'Couverture / charpente',adresse:'Route de l\'Adour',cp:'65500',ville:'VIC-EN-BIGORRE',dept:'65',effectif:'3 à 5 salariés',rge:true,statut:'nouveau',adherent:false,creation:'2019-07-22'},
  {id:45,nom:'ÉTANCHÉITÉ BARDAGE OSSABAT',siret:'70012345678901',siren:'700123456',naf:'43.99B',activite:'Travaux d\'étanchéification et bardage métallique',metier:'Étanchéité / métallerie',adresse:'ZA Lapuyade',cp:'64300',ville:'ORTHEZ',dept:'64',effectif:'10 à 19 salariés',rge:false,statut:'a_contacter',adherent:false,creation:'2011-01-17'},
];

// ═══════════════════════════ ÉTAT ════════════════════════════════════
let filtered = [...DATA];
let sortCol = 'nom';
let sortDir = 'asc';
let curPage = 0;
const PER = 20;

const STATUT = {
  nouveau:'Nouveau', a_contacter:'À contacter', contacte:'Contacté',
  relance:'Relance', rdv:'RDV', adherent:'Adhérent',
  prospect_perdu:'Perdu', opt_out:'Opt-out'
};

// ═══════════════════════════ INIT ════════════════════════════════════
function init() {
  const metiers = [...new Set(DATA.map(a=>a.metier))].sort();
  const sel = document.getElementById('f-metier');
  metiers.forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = m; sel.appendChild(o);
  });
  document.getElementById('stat-rge').textContent = DATA.filter(a=>a.rge).length;
  document.getElementById('stat-adherent').textContent = DATA.filter(a=>a.adherent).length;
  document.getElementById('stat-dept64').textContent = DATA.filter(a=>a.dept==='64').length;
  document.getElementById('stat-dept65').textContent = DATA.filter(a=>a.dept==='65').length;
  applyFilters();
}

// ═══════════════════════════ FILTRES ═════════════════════════════════
function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const dept = document.getElementById('f-dept').value;
  const metier = document.getElementById('f-metier').value;
  const statut = document.getElementById('f-statut').value;
  const rge = document.getElementById('f-rge').value;

  filtered = DATA.filter(a => {
    if (q && !a.nom.toLowerCase().includes(q) && !a.ville.toLowerCase().includes(q) && !a.siret.includes(q)) return false;
    if (dept && a.dept !== dept) return false;
    if (metier && a.metier !== metier) return false;
    if (statut && a.statut !== statut) return false;
    if (rge === 'oui' && !a.rge) return false;
    if (rge === 'non' && a.rge) return false;
    return true;
  });

  filtered.sort((a,b) => {
    const av = (a[sortCol]||'').toString().toLowerCase();
    const bv = (b[sortCol]||'').toString().toLowerCase();
    return sortDir === 'asc' ? av.localeCompare(bv,'fr') : bv.localeCompare(av,'fr');
  });

  curPage = 0;
  render();
}

function resetFilters() {
  document.getElementById('search').value = '';
  document.getElementById('f-dept').value = '';
  document.getElementById('f-metier').value = '';
  document.getElementById('f-statut').value = '';
  document.getElementById('f-rge').value = '';
  applyFilters();
}

function sortBy(col) {
  if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortCol = col; sortDir = 'asc'; }
  ['nom','metier','ville'].forEach(c => {
    const el = document.getElementById('s-'+c);
    if (el) el.textContent = '';
  });
  const el = document.getElementById('s-'+col);
  if (el) el.textContent = sortDir === 'asc' ? ' ↑' : ' ↓';
  applyFilters();
}

// ═══════════════════════════ RENDU ═══════════════════════════════════
function render() {
  const start = curPage * PER;
  const rows = filtered.slice(start, start + PER);
  const pages = Math.max(1, Math.ceil(filtered.length / PER));

  document.getElementById('counter').textContent =
    `${filtered.length.toLocaleString('fr')} artisan${filtered.length>1?'s':''} affichés sur ${DATA.length} au total`;
  document.getElementById('hdr-total').textContent = DATA.length;
  document.getElementById('page-info').textContent = `Page ${curPage+1} / ${pages}`;
  document.getElementById('btn-prev').disabled = curPage === 0;
  document.getElementById('btn-next').disabled = curPage >= pages - 1;

  document.getElementById('tbody').innerHTML = rows.length ? rows.map((a,i) => `
    <tr class="${i%2===0?'bg-white':'bg-gray-50/40'} border-b" onclick="openPanel(${a.id})">
      <td class="px-3 py-2 font-medium text-gray-800 max-w-xs truncate">${a.nom}</td>
      <td class="px-3 py-2 text-gray-600 text-xs">${a.metier}</td>
      <td class="px-3 py-2 text-gray-600">${a.ville}</td>
      <td class="px-3 py-2 text-gray-500 font-mono text-xs">${a.dept}</td>
      <td class="px-3 py-2">
        <span class="px-2 py-0.5 rounded text-xs font-medium badge-${a.statut}">${STATUT[a.statut]||a.statut}</span>
      </td>
      <td class="px-3 py-2">
        ${a.rge?'<span class="px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800">RGE</span>':''}
      </td>
      <td class="px-3 py-2">
        ${a.adherent?'<span class="px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800">Oui</span>':''}
      </td>
    </tr>`).join('')
  : '<tr><td colspan="7" class="text-center py-16 text-gray-400 text-sm">Aucun résultat pour ces critères</td></tr>';
}

function prevPage() { if (curPage>0){curPage--;render();} }
function nextPage() { const p=Math.ceil(filtered.length/PER); if(curPage<p-1){curPage++;render();} }

// ═══════════════════════════ PANEL ═══════════════════════════════════
function openPanel(id) {
  const a = DATA.find(x=>x.id===id);
  if (!a) return;
  document.getElementById('p-title').textContent = a.nom;

  const badges = [
    `<span class="px-2 py-0.5 rounded text-xs font-medium border border-gray-200 badge-${a.statut}">${STATUT[a.statut]||a.statut}</span>`,
    a.rge ? '<span class="px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800">RGE</span>' : '',
    a.adherent ? '<span class="px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800">Adhérent CAPEB</span>' : '',
  ].filter(Boolean).join('');
  document.getElementById('p-badges').innerHTML = badges;

  const row = (l,v) => v ? `<div class="flex flex-col gap-0.5"><span class="text-xs text-gray-400 uppercase tracking-wide font-medium">${l}</span><span class="text-gray-800">${v}</span></div>` : '';

  document.getElementById('p-body').innerHTML = `
    <div class="grid grid-cols-2 gap-3">
      ${row('SIRET',a.siret)} ${row('SIREN',a.siren)}
      ${row('Code NAF',a.naf)} ${row('Département',a.dept)}
    </div>
    <div class="border-t border-gray-100 pt-4">
      <p class="text-xs text-gray-400 uppercase font-medium mb-2">Activité</p>
      <p class="text-gray-700">${a.activite}</p>
    </div>
    <div class="border-t border-gray-100 pt-4 grid grid-cols-2 gap-3">
      ${row('Adresse',a.adresse)} ${row('Code postal',a.cp)}
      ${row('Ville',a.ville)} ${row('Téléphone','—')}
      ${row('Email','—')} ${row('Site internet','—')}
    </div>
    <div class="border-t border-gray-100 pt-4 grid grid-cols-2 gap-3">
      ${row('Effectif',a.effectif)} ${row('Date création',a.creation)}
    </div>
    <div class="border-t border-gray-100 pt-4">
      <p class="text-xs text-gray-400 uppercase font-medium mb-2">Notes</p>
      <p class="text-gray-400 italic text-sm">Aucune note — fonctionnalité disponible en version complète</p>
    </div>`;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
}

// ═══════════════════════════ EXPORT CSV ══════════════════════════════
function exportCsv() {
  const headers = ['Entreprise','SIRET','Métier','Ville','Département','Statut','RGE','Adhérent','Effectif','Création'];
  const rows = filtered.map(a => [
    a.nom, a.siret, a.metier, a.ville, a.dept,
    STATUT[a.statut]||a.statut, a.rge?'Oui':'Non', a.adherent?'Oui':'Non',
    a.effectif||'', a.creation||''
  ]);
  const csv = [headers,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a');
  el.href=url; el.download=`artisans-capeb-${new Date().toISOString().slice(0,10)}.csv`;
  el.click(); URL.revokeObjectURL(url);
}

// ═══════════════════════════ START ═══════════════════════════════════
init();
</script>
